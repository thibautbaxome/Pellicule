name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Publication d'une version à la demande. L'étiquette est posée par le
  # runner : c'est ce qui permet de publier depuis un environnement dont
  # l'accès Git sortant ne laisse pas passer les étiquettes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple v0.1.0"
        required: true
        type: string

# Deux poussées rapprochées produisaient deux exécutions qui se disputaient la
# branche des captures, et celle qu'on finissait par lire n'était pas celle du
# dernier commit. La plus ancienne est désormais abandonnée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le noyau métier ne dépend d'aucun SDK Apple : il se compile et se teste sur
  # Linux, ce qui donne une boucle de quelques secondes plutôt que de quelques
  # minutes. C'est là que vivent tous les calculs argentiques, le carnet et sa
  # persistance, et c'est aussi ce qui valide les banques de matériel — elles
  # sont écrites à la main.
  core-linux:
    name: Tests du noyau (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: PelliculeCore
        run: swift test

  # L'application elle-même, compilée pour l'appareil. Les runners macOS sont
  # gratuits sur les dépôts publics : c'est ce qui rend l'ensemble possible sans
  # posséder de Mac.
  app:
    name: Application iOS
    runs-on: macos-15
    # Nécessaire pour publier la version : le jeton est en lecture seule par
    # défaut sur un dépôt public.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Le .xcodeproj n'est pas versionné — format binaire de fait, illisible en
      # revue et champion des conflits. XcodeGen le reconstitue depuis
      # project.yml.
      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Engendrer le projet
        run: xcodegen generate

      # Sans signature : l'application est signée sur l'appareil, au moment de
      # l'installation, par le compte Apple de son utilisateur.
      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pellicule.xcodeproj \
            -scheme Pellicule \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify || xcodebuild build \
              -project Pellicule.xcodeproj \
              -scheme Pellicule \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      # Un IPA n'est qu'une archive zip contenant un dossier Payload.
      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pellicule.app Payload/
          zip -qry Pellicule.ipa Payload
          ls -lh Pellicule.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pellicule-ipa
          path: Pellicule.ipa
          if-no-files-found: error

      # Une version publiée donne une adresse directe, que SideStore sait
      # ouvrir depuis l'iPhone sans passer par un ordinateur.
      - name: Publier la version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" Pellicule.ipa \
            --target "${GITHUB_SHA}" \
            --title "Pellicule $VERSION" \
            --notes "$(cat <<'NOTES'
          Application **non signée**, à installer avec SideStore — elle sera
          signée sur votre iPhone par votre propre compte Apple.

          Le parcours complet, et ce qu'il coûte, sont décrits dans
          [INSTALLATION.md](https://github.com/thibautbaxome/Pellicule/blob/main/INSTALLATION.md).

          Une mise à jour conserve le carnet : il vit dans les documents de
          l'application, pas dans le code.
          NOTES
          )"

  # Le parcours dans le simulateur : le seul œil de ce projet sur son
  # interface, qui s'écrit dans un environnement sans macOS. Il échoue si un
  # écran ne s'affiche pas, et publie une capture par étape sur la branche
  # « captures », d'où elles peuvent être relues.
  simulator:
    name: Parcours dans le simulateur
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Engendrer le projet
        run: xcodegen generate

      - name: Démarrer un iPhone
        id: device
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for entry in entries:
                  if entry.get('isAvailable') and entry['name'].startswith('iPhone'):
                      best = entry
          print(best['udid'])
          ")
          echo 'udid='"$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices | grep "$udid"

      # Filet de sécurité : même si le parcours ne se construit pas, on veut
      # savoir si l'application s'ouvre, et à quoi elle ressemble.
      - name: Lancer l'application seule
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pellicule.xcodeproj \
            -scheme Pellicule \
            -configuration Debug \
            -destination "id=${{ steps.device.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
          xcrun simctl install "${{ steps.device.outputs.udid }}" \
            build-sim/Build/Products/Debug-iphonesimulator/Pellicule.app
          # La position est accordée d'avance : la boîte de dialogue du système
          # n'a rien à faire sur les captures. Le moniteur du parcours reste en filet.
          xcrun simctl privacy "${{ steps.device.outputs.udid }}" grant location app.pellicule.carnet || true
          xcrun simctl launch "${{ steps.device.outputs.udid }}" app.pellicule.carnet
          sleep 6
          mkdir -p captures
          xcrun simctl io "${{ steps.device.outputs.udid }}" screenshot captures/00-lancement.png
          xcrun simctl terminate "${{ steps.device.outputs.udid }}" app.pellicule.carnet || true

      - name: Parcours complet
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pellicule.xcodeproj \
            -scheme Pellicule \
            -destination "id=${{ steps.device.outputs.udid }}" \
            -derivedDataPath build-sim \
            -resultBundlePath Parcours.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      # Les captures dorment dans le paquet de résultats sous des noms de
      # hachage ; le manifeste rend les noms lisibles.
      - name: Extraire les captures
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path Parcours.xcresult --output-path captures-brutes || true
          python3 - <<'EOF'
          import json, pathlib, shutil
          source = pathlib.Path("captures-brutes")
          target = pathlib.Path("captures")
          target.mkdir(exist_ok=True)
          manifest = source / "manifest.json"
          if not manifest.exists():
              print("aucun manifeste : le parcours n'a produit aucune capture")
              raise SystemExit(0)
          # Xcode joint aussi une vidéo de la session, la hiérarchie des vues et
          # une description par échec — utiles dans Xcode, pas ici : la vidéo
          # pèse dix mégaoctets et les descriptions portent des guillemets dans
          # leur nom de fichier, ce que l'archivage refuse. Seules les captures
          # nommées par le parcours sont retenues, et elles commencent par leur
          # rang.
          for entry in json.loads(manifest.read_text()):
              for item in entry.get("attachments", []):
                  exported = item.get("exportedFileName")
                  name = item.get("suggestedHumanReadableName") or exported or ""
                  stem = pathlib.Path(name).stem
                  if not exported or not stem[:1].isdigit():
                      continue
                  origin = source / exported
                  if origin.exists():
                      shutil.copy(origin, target / f"{stem}.png")
                      print("capture", stem)
          EOF
          ls -la captures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures
          if-no-files-found: warn

      # Publiées sur une branche à part : le dépôt principal n'a pas à porter
      # des images qui changent à chaque poussée, mais elles doivent être
      # consultables sans authentification.
      - name: Publier les captures
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd captures
          cat > LISEZMOI.md <<EOF
          # Captures du parcours automatisé

          Commit : ${GITHUB_SHA}
          Exécution : ${GITHUB_RUN_ID}

          Engendrées à chaque poussée sur \`main\` par le parcours dans le
          simulateur. Elles sont écrasées à chaque exécution : cette branche
          n'a pas d'historique utile, elle sert à regarder l'interface.
          EOF
          git init -q
          git checkout -qb captures
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -qm "Captures de ${GITHUB_SHA:0:7}"
          git push -qf \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" captures
