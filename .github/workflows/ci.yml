name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Publication d'une version à la demande. L'étiquette est posée par le
  # runner : c'est ce qui permet de publier depuis un environnement dont
  # l'accès Git sortant ne laisse pas passer les étiquettes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple v0.1.0"
        required: true
        type: string

jobs:
  # Le noyau métier ne dépend d'aucun SDK Apple : il se compile et se teste sur
  # Linux, ce qui donne une boucle de quelques secondes plutôt que de quelques
  # minutes. C'est là que vivent tous les calculs argentiques, le carnet et sa
  # persistance, et c'est aussi ce qui valide les banques de matériel — elles
  # sont écrites à la main.
  core-linux:
    name: Tests du noyau (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: PelliculeCore
        run: swift test

  # L'application elle-même, compilée pour l'appareil. Les runners macOS sont
  # gratuits sur les dépôts publics : c'est ce qui rend l'ensemble possible sans
  # posséder de Mac.
  app:
    name: Application iOS
    runs-on: macos-15
    # Nécessaire pour publier la version : le jeton est en lecture seule par
    # défaut sur un dépôt public.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Le .xcodeproj n'est pas versionné — format binaire de fait, illisible en
      # revue et champion des conflits. XcodeGen le reconstitue depuis
      # project.yml.
      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Engendrer le projet
        run: xcodegen generate

      # Sans signature : l'application est signée sur l'appareil, au moment de
      # l'installation, par le compte Apple de son utilisateur.
      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pellicule.xcodeproj \
            -scheme Pellicule \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify || xcodebuild build \
              -project Pellicule.xcodeproj \
              -scheme Pellicule \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      # Un IPA n'est qu'une archive zip contenant un dossier Payload.
      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pellicule.app Payload/
          zip -qry Pellicule.ipa Payload
          ls -lh Pellicule.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pellicule-ipa
          path: Pellicule.ipa
          if-no-files-found: error

      # Une version publiée donne une adresse directe, que SideStore sait
      # ouvrir depuis l'iPhone sans passer par un ordinateur.
      - name: Publier la version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" Pellicule.ipa \
            --target "${GITHUB_SHA}" \
            --title "Pellicule $VERSION" \
            --notes "$(cat <<'NOTES'
          Application **non signée**, à installer avec SideStore — elle sera
          signée sur votre iPhone par votre propre compte Apple.

          Le parcours complet, et ce qu'il coûte, sont décrits dans
          [INSTALLATION.md](https://github.com/thibautbaxome/Pellicule/blob/main/INSTALLATION.md).

          Une mise à jour conserve le carnet : il vit dans les documents de
          l'application, pas dans le code.
          NOTES
          )"
