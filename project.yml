# Description du projet Xcode, engendrée par XcodeGen.
#
# Le fichier .xcodeproj n'est pas versionné : c'est un format binaire de fait,
# illisible en revue et champion des conflits de fusion. Ces quarante lignes le
# remplacent, et `xcodegen generate` le reconstitue à l'identique.
name: Pellicule

options:
  bundleIdPrefix: app.pellicule
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Une seule cible, aucun schéma à partager : inutile de les versionner.
  xcodeVersion: "15.0"

packages:
  PelliculeCore:
    path: PelliculeCore

targets:
  Pellicule:
    type: application
    platform: iOS
    # Tout ce qui n'est pas du code dans App — les polices, le catalogue
    # d'icônes — est copié comme ressource. Les polices sont enregistrées au
    # lancement par Typo.registerFonts.
    sources:
      - path: App
    dependencies:
      - package: PelliculeCore
        product: PelliculeCore
    # Schéma partagé explicite : sans lui, xcodebuild sur un poste vierge ne
    # trouve rien à compiler.
    scheme:
      testTargets:
        - PelliculeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pellicule.carnet
        PRODUCT_NAME: Pellicule
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        # iPhone seulement, en portrait : un carnet se tient d'une main.
        TARGETED_DEVICE_FAMILY: "1"

        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pellicule
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Le carnet apparaît dans l'application Fichiers, sous « Sur mon
        # iPhone ». C'est ce qui rend la promesse tenable : le fichier
        # appartient au photographe, et reste récupérable même si
        # l'application refuse de s'ouvrir.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Ces textes s'affichent tels quels dans la demande d'autorisation :
        # ils doivent dire à quoi sert l'accès, pas le réclamer.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Pour photographier le cadrage d'une vue, et pour estimer la lumière
          d'une scène. Les images restent dans le téléphone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Pour noter où une vue a été prise, et l'inscrire ensuite dans les
          métadonnées du scan. La position ne quitte pas le téléphone.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          Pour joindre une photo de repérage à une vue depuis vos albums.

        # L'application n'est pas signée ici : elle l'est sur l'appareil, au
        # moment de l'installation, par le compte Apple de son utilisateur.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Manual

        # Mode Swift 5 pour l'interface, quand le noyau est en Swift 6 : le
        # code SwiftUI s'écrit ici sans pouvoir être exécuté, et l'isolement
        # strict du mode 6 y coûterait des allers-retours d'intégration
        # continue sans rien apporter à une application mono-fil.
        SWIFT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Parcours automatisé dans le simulateur. C'est le seul œil dont dispose ce
  # projet sur son interface : elle s'écrit dans un environnement sans macOS,
  # donc sans simulateur. Chaque étape produit une capture.
  PelliculeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pellicule
    settings:
      base:
        SWIFT_VERSION: "5"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Pellicule
